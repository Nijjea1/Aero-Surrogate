# REAL DrivAerNet data — design parameters → Cd. No meshes needed.
#
#   python -m src.data.drivaernet --fetch
#   python -m src.data.dataset --check --config configs/drivaernet.yaml
#   python -m src.train.train --config configs/drivaernet.yaml
#   python -m src.train.train --config configs/drivaernet.yaml --split category
#
# 4,165 designs, 23 morph parameters, CFD-measured Average Cd.
# Source: github.com/Mohamedelrefaie/DrivAerNet — CC BY-NC 4.0, NON-COMMERCIAL.
#
# REPORT R² AGAINST 0.906, NOT 1.0. The Std Cd column gives the solver's own
# run-to-run spread; it caps any model at R² = 0.906. See src/data/drivaernet.py.

run_name: drivaernet
seed: 0

data:
  kind: table
  labels_csv: data/drivaernet/parametric.csv

  id_column: Experiment
  target_column: Average Cd
  category_column: Category      # fastback | notchback | estateback, from the id prefix

  # The 23 morph parameters, in CSV order. These are DELTAS from the baseline
  # DrivAer body, not absolute dimensions, and they are NOT the same space as
  # contracts.PARAM_BOUNDS — see docs/HANDOFF.md.
  param_columns:
    - B_Ramp_Angle
    - B_Diffusor_Angle
    - B_Trunklid_Angle
    - C_Side_Mirrors_Rotation
    - D_Rear_Window_Inclination
    - D_Winscreen_Inclination
    - C_Side_Mirrors_Translate_X
    - C_Side_Mirrors_Translate_Z
    - D_Winscreen_Length
    - D_Rear_Window_Length
    - E_A_B_C_Pillar_Thickness
    - G_Trunklid_Curvature
    - G_Trunklid_Length
    - H_Front_Bumper_Curvature
    - H_Front_Bumper_Length
    - F_Door_Handles_Thickness
    - F_Door_Handles_Z_Position
    - E_Fenders_Arch_Offset
    - A_Car_Length
    - F_Door_Handles_X_Position
    - A_Car_Width
    - A_Car_Roof_Height
    - A_Car_Green_House_Angle
    # Body style. Worth 0.27 R² because the 23 parameters above are deltas
    # from a different baseline body per category. See src/data/drivaernet.py.
    - cat_fastback
    - cat_notchback
    - cat_estateback

  val_fraction: 0.15
  test_fraction: 0.15

model:
  kind: param_mlp
  in_dim: 26
  hidden_dim: 256              # 4,165 designs supports more capacity than 300 did
  n_layers: 3
  dropout: 0.1
  heteroscedastic: true
  quadratic_features: false

train:
  epochs: 400
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-3
  grad_clip: 1.0
  num_workers: 0
  amp: false
  two_stage: true
  variance_epochs: 300
  variance_patience: 30
  variance_lr: 1.0e-3
  nll_beta: 0.5
  patience: 40
  out_dir: runs
