# Stage 2 — surface pressure field prediction on DrivAerML.
#
#   python -m src.data.drivaerml --runs 30 --download
#   python -m src.data.preprocess --combine
#   python -m src.data.fields --extract
#   python -m src.train.train_fields --config configs/fields.yaml
#
# Sized for an M-series GPU (MPS) or Kaggle T4. The release does not claim
# Nebius GPU training; actual checkpoint provenance is recorded separately.

run_name: fields
seed: 0

data:
  root: data/drivaerml
  val_runs: 5
  test_runs: 5                 # 20 train / 5 val / 5 test, as the DoMINO
                               # fine-tuning recipe was validated on
  n_query: 4096                # query points per car per step, resampled each
                               # epoch from the 100k stored
  n_cloud: 2048                # geometry cloud for the global encoder

model:
  latent_dim: 256              # global geometry latent
  # Three neighbourhood sizes, pooled separately. Curvature at a trailing
  # edge and curvature across a panel are different quantities, and this is
  # DoMINO's multi-scale idea applied where it matters. Measured against a
  # single k=16, with the Fourier lift and the integral term both on:
  #   k=16         Cp R² 0.4869   Cd err +0.0091
  #   k=8/32/128   Cp R² 0.5105   Cd err -0.0009   <- better on both
  local_k: [8, 32, 128]
  local_dim: 96
  n_freq: 8                    # Fourier octaves on the query position
  hidden: 256
  n_layers: 4
  dropout: 0.0
  heteroscedastic: true        # per-point sigma; the field's uncertainty

train:
  epochs: 120
  variance_epochs: 80
  batch_size: 4                # 4 cars x 4096 points = 16k points per step
  lr: 1.0e-3
  variance_lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  # Weight on the integral-consistency term. Pointwise loss and integrated
  # drag are different objectives -- Fourier features buy 0.16 Cp R2 and cost
  # 0.05 Cd error -- so the integral goes in the loss rather than being hoped
  # for. Set to 0 to drop it; see field_model.integral_consistency_loss.
  integral_weight: 1.0
  patience: 20
  variance_patience: 15
  out_dir: runs
